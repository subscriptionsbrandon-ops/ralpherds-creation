<!DOCTYPE html>
<!-- strata build: republish r1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Strata — Archaeological Dig Site</title>
<style>
 html,body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#141210;font-family:'Segoe UI',system-ui,sans-serif;color:#e8e2d4;-webkit-user-select:none;user-select:none}
 #cv{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
 .chip{background:rgba(20,17,14,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 12px;font-size:12px;letter-spacing:.4px}
 #topL{position:fixed;top:10px;left:10px;display:flex;gap:8px;align-items:center;z-index:5}
 #topR{position:fixed;top:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap;justify-content:flex-end}
 .bar{width:100px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
 .bar i{display:block;height:100%;border-radius:4px;transition:width .25s}
 #ebar i{background:linear-gradient(90deg,#e8b34b,#f0d078)}
 #xbar i{background:linear-gradient(90deg,#7db2e8,#9fd0f0)}
 #toolbar{position:fixed;left:50%;bottom:calc(12px + var(--vvb,0px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;z-index:5}
 .tbtn{width:56px;height:58px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(20,17,14,.72);backdrop-filter:blur(6px);color:#cfc6b2;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
 .tbtn.on{border-color:#e8b34b;color:#f2d992;background:rgba(60,45,20,.8);box-shadow:0 0 12px rgba(232,179,75,.25)}
 #side{position:fixed;right:12px;bottom:calc(12px + var(--vvb,0px) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
 #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:8;pointer-events:none;width:max-content;max-width:90vw}
 .tmsg{background:rgba(20,17,14,.87);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 16px;font-size:13px;animation:tin .3s ease;box-shadow:0 4px 18px rgba(0,0,0,.4)}
 @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
 #modal{position:fixed;inset:0;background:rgba(8,7,5,.78);backdrop-filter:blur(8px);z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto}
 .panel{background:#1c1813;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px;max-width:780px;width:min(92vw,780px);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
 h1{font-size:26px;margin:0 0 4px;color:#f0d891;font-weight:600;letter-spacing:2px}
 h2{font-size:18px;margin:0 0 6px;color:#f0d891}
 .sub{color:#9a917d;font-size:13px;margin-bottom:14px;line-height:1.5}
 .blist{display:flex;flex-direction:column;margin:8px 0 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}
 .brow{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.06);transition:.15s}
 .brow:last-child{border-bottom:none}
 .brow:hover{background:rgba(232,179,75,.08)}
 .brow.sel{background:rgba(232,179,75,.14)}
 .brow .bicon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
 .brow .bicon svg{width:20px;height:20px;display:block}
 .brow .binfo{flex:1;min-width:0}
 .brow .binfo b{font-size:14px;display:block}
 .brow .binfo span{font-size:11px;color:#9a917d;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .brow .bstat{font-size:12px;color:#e8b34b;white-space:nowrap;flex-shrink:0;letter-spacing:1px}
 .btn{background:linear-gradient(180deg,#e8b34b,#c99230);border:none;color:#2a1f0c;font-weight:700;padding:11px 26px;border-radius:10px;font-size:15px;cursor:pointer;letter-spacing:.5px}
 .btn:hover{filter:brightness(1.08)}
 .btn2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#d8d0bd;padding:9px 18px;border-radius:10px;font-size:13px;cursor:pointer}
 input[type=text]{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#e8e2d4;padding:9px 12px;font-size:13px;width:160px;letter-spacing:1px;text-transform:uppercase}
 .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
 .mcell{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.02)}
 .mcell img{width:50px;height:50px;object-fit:contain}
 .mcell div{font-size:10px;margin-top:4px;color:#bdb49e}
 .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
 .tab{padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid transparent}
 .tab.on{border-color:#e8b34b;color:#f2d992}
 .frow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
 .rar{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:.5px}
 .hidden{display:none!important}
 @media (max-width:600px){
  .chip{padding:5px 9px;font-size:11px;border-radius:8px}
  .bar{display:none}
  #topL{top:calc(8px + env(safe-area-inset-top,0px));left:8px;max-width:46vw}
  #topL .chip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  #topR{top:calc(8px + env(safe-area-inset-top,0px));right:8px;gap:5px}
  .tbtn{width:46px;height:50px;font-size:8px;border-radius:10px}
  .tbtn>div{font-size:15px!important}
  #toolbar{gap:5px;bottom:calc(10px + var(--vvb,0px) + env(safe-area-inset-bottom,0px))}
  #side{flex-direction:row;right:auto;left:50%;transform:translateX(-50%);bottom:calc(68px + var(--vvb,0px) + env(safe-area-inset-bottom,0px))}
  .panel{padding:18px 16px;border-radius:14px}
  h1{font-size:22px}
  .brow{padding:9px 10px;gap:9px}
  .brow .bicon{width:34px;height:34px}
  .brow .bicon svg{width:17px;height:17px}
  .brow .binfo b{font-size:13px}
  .brow .binfo span{font-size:10px}
  input[type=text]{width:120px}
 }
 @media (max-width:380px){
  .chip{padding:4px 7px;font-size:10px}
  #topL{max-width:42vw}
  .tbtn{width:44px;height:48px}
 }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topL"><div class="chip" id="locChip">—</div></div>
<div id="topR">
 <div class="chip">⚡ <span id="enTxt">0</span><span class="bar" id="ebar"><i style="width:100%"></i></span></div>
 <div class="chip">🪙 <span id="coinTxt">0</span></div>
 <div class="chip">Lv <span id="lvTxt">1</span><span class="bar" id="xbar"><i style="width:0%"></i></span></div>
</div>
<div id="toolbar"></div>
<div id="side"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
'use strict';
const TOUCH=matchMedia('(pointer:coarse)').matches;
/* ============ utils ============ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}

 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v)}

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
/* ============ rarity / categories ============ */
const RARITY={common:{n:'Common',c:'#9aa3a8'},uncommon:{n:'Uncommon',c:'#6cc36c'},rare:{n:'Rare',c:'#5b9fe8'},epic:{n:'Epic',c:'#b06ce8'},legendary:{n:'Legendary',c:'#e8a13c'},mythic:{n:'Mythic',c:'#e85c8a'}};
const CATLIST=['Fossils','Gems','Minerals','Artifacts','Treasure','Structures'];
const CATC={Fossils:'#e8c860',Gems:'#b06ce8',Minerals:'#e8843c',Artifacts:'#5bc8e8',Treasure:'#f0d060',Structures:'#8fe86c'};
const CATHINT={Fossils:'ancient remains',Gems:'something crystalline',Minerals:'a metallic mass',Artifacts:'something man-made',Treasure:'something valuable',Structures:'a large structure'};
/* ============ sprite drawing ============ */
function shade(g,w,h){const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'rgba(255,255,255,.22)');gr.addColorStop(.55,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.28)');
 g.globalCompositeOperation='source-atop';g.fillStyle=gr;g.fillRect(0,0,w,h);g.globalCompositeOperation='source-over'}
const DRAW={
ammonite(g,w,h){const cx=w*.5,cy=h*.5,R0=w*.42;g.lineCap='round';
 for(let pass=0;pass<2;pass++){g.beginPath();
  for(let t=0;t<=6.9;t+=.08){const r=R0*Math.pow(.72,t*.55);const x=cx+Math.cos(t*1.9)*r,y=cy+Math.sin(t*1.9)*r;t?g.lineTo(x,y):g.moveTo(x,y)}
  g.strokeStyle=pass?'#c4b087':'#6e5c40';g.lineWidth=pass?w*.09:w*.14;g.stroke()}
 g.strokeStyle='rgba(70,55,35,.55)';g.lineWidth=1.2;
 for(let t=.3;t<6.5;t+=.4){const r=R0*Math.pow(.72,t*.55),a=t*1.9;
  g.beginPath();g.moveTo(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.7);g.lineTo(cx+Math.cos(a)*r*1.15,cy+Math.sin(a)*r*1.15);g.stroke()}},
trilobite(g,w,h){const cx=w/2;g.fillStyle='#6b5d48';
 g.beginPath();g.ellipse(cx,h*.52,w*.32,h*.42,0,0,TAU);g.fill();
 g.fillStyle='#7d6e55';g.beginPath();g.ellipse(cx,h*.22,w*.3,h*.15,0,0,TAU);g.fill();
 g.strokeStyle='rgba(35,28,18,.6)';g.lineWidth=1.6;
 for(let i=0;i<8;i++){const y=h*.32+i*h*.075;g.beginPath();g.moveTo(cx-w*.29+i*1.2,y);g.quadraticCurveTo(cx,y+4,cx+w*.29-i*1.2,y);g.stroke()}
 g.beginPath();g.moveTo(cx-w*.09,h*.3);g.lineTo(cx-w*.09,h*.88);g.moveTo(cx+w*.09,h*.3);g.lineTo(cx+w*.09,h*.88);g.stroke();
 g.fillStyle='#2e2519';g.beginPath();g.arc(cx-w*.14,h*.2,2.2,0,TAU);g.arc(cx+w*.14,h*.2,2.2,0,TAU);g.fill();shade(g,w,h)},
tooth(g,w,h,o){const c=o&&o.c?o.c:['#e8e0cc','#8a7a5c'];

 g.quadraticCurveTo(w*.72,h*.5,w*.52,h*.95);g.quadraticCurveTo(w*.42,h*.6,w*.15,h*.22);g.closePath();
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,c[1]);gr.addColorStop(.28,c[1]);gr.addColorStop(.38,c[0]);gr.addColorStop(1,c[0]);
 g.fillStyle=gr;g.fill();g.strokeStyle='rgba(40,30,20,.5)';g.lineWidth=1.4;g.stroke();shade(g,w,h)},
claw(g,w,h){g.beginPath();g.moveTo(w*.18,h*.85);g.quadraticCurveTo(w*.05,h*.35,w*.45,h*.08);
 g.quadraticCurveTo(w*.42,h*.45,w*.52,h*.82);g.closePath();
 const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#d8ccb0');gr.addColorStop(1,'#9a8a68');g.fillStyle=gr;g.fill();
 g.strokeStyle='rgba(50,40,25,.5)';g.lineWidth=1.4;g.stroke();shade(g,w,h)},
vertebra(g,w,h){const cx=w/2,cy=h/2;
 g.fillStyle='#c5b898';
 const arms=[[-.55,.34],[.55,.34],[Math.PI-.55,.34],[Math.PI+.55,.34],[-Math.PI/2,.42]];
 for(let i=0;i<arms.length;i++){g.save();g.translate(cx,cy);g.rotate(arms[i][0]);
  g.fillRect(-w*.055,-h*arms[i][1]-h*.08,w*.11,h*arms[i][1]+h*.08);g.restore()}
 g.fillStyle='#d5c9ac';g.beginPath();g.ellipse(cx,cy,w*.26,h*.2,0,0,TAU);g.fill();
 g.strokeStyle='rgba(60,50,32,.5)';g.lineWidth=1.3;g.beginPath();g.ellipse(cx,cy,w*.26,h*.2,0,0,TAU);g.stroke();shade(g,w,h)},
fish(g,w,h){g.strokeStyle='#8f8266';g.lineCap='round';
 g.lineWidth=2.6;g.beginPath();g.moveTo(w*.14,h*.5);g.lineTo(w*.8,h*.5);g.stroke();
 g.lineWidth=1.4;
 for(let i=0;i<10;i++){const x=w*.2+i*w*.055,l=h*.28*(1-i/13);
  g.beginPath();g.moveTo(x,h*.5-l);g.lineTo(x,h*.5+l);g.stroke()}
 g.lineWidth=2;g.beginPath();g.arc(w*.13,h*.5,w*.06,0,TAU);g.stroke();
 g.beginPath();g.moveTo(w*.8,h*.5);g.lineTo(w*.93,h*.34);g.moveTo(w*.8,h*.5);g.lineTo(w*.93,h*.66);g.stroke()},
amber(g,w,h){const cx=w/2,cy=h/2;g.beginPath();
 for(let a=0;a<TAU;a+=.4){const r=w*.38*(.85+.3*hash2(Math.round(a*10),3,4));g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}
 g.closePath();const gr=g.createRadialGradient(cx-6,cy-6,2,cx,cy,w*.45);gr.addColorStop(0,'#f5c860');gr.addColorStop(1,'#b06818');
 g.fillStyle=gr;g.fill();
 g.fillStyle='rgba(40,20,5,.7)';g.beginPath();g.ellipse(cx+2,cy+2,3,2,.5,0,TAU);g.fill();
 g.strokeStyle='rgba(40,20,5,.5)';g.lineWidth=.8;
 const legs=[[-3,-2],[3,-2],[-3,2],[3,2],[0,-3],[0,3]];
 for(let i=0;i<legs.length;i++){g.beginPath();g.moveTo(cx+2,cy+2);g.lineTo(cx+2+legs[i][0]*2,cy+2+legs[i][1]*2);g.stroke()}
 shade(g,w,h)},
tusk(g,w,h){g.lineCap='round';
 g.strokeStyle='#a89468';g.lineWidth=w*.14;g.beginPath();g.moveTo(w*.12,h*.85);g.quadraticCurveTo(w*.25,h*.12,w*.88,h*.22);g.stroke();
 g.strokeStyle='#e5dcc2';g.lineWidth=w*.1;g.beginPath();g.moveTo(w*.13,h*.83);g.quadraticCurveTo(w*.26,h*.13,w*.86,h*.22);g.stroke()},
gem(g,w,h,o){const c=o&&o.c?o.c:['#c9a7f0','#8a4fd0'];const cx=w/2,cy=h/2,r=w*.42;
 g.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;i?g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.closePath();
 const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);g.fillStyle=gr;g.fill();
 g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.3;
 for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.stroke()}
 g.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;i?g.lineTo(cx+Math.cos(a)*r*.45,cy+Math.sin(a)*r*.45):g.moveTo(cx+Math.cos(a)*r*.45,cy+Math.sin(a)*r*.45)}g.closePath();
 g.fillStyle='rgba(255,255,255,.28)';g.fill();shade(g,w,h)},
crystals(g,w,h,o){const c=o&&o.c?o.c:['#d8c8ff','#7a5bd0'];
 const n=Math.max(6,Math.round(w/34));
 for(let i=0;i<n;i++){const x=w*.15+(i/(n-1))*w*.7+(i%2?w*.02:-w*.015),y=h*.68;

  g.fillStyle=gr;g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.stroke();g.restore()}
 shade(g,w,h)},
nugget(g,w,h,o){const c=o&&o.c?o.c:['#f0d060','#a07820'];
 for(let i=0;i<5;i++){const x=w*(.3+hash2(i,1,7)*.4),y=h*(.3+hash2(i,2,7)*.4),r=w*(.13+hash2(i,3,7)*.12);

  g.closePath();const gr=g.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r*1.2);gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);g.fillStyle=gr;g.fill()}
 shade(g,w,h)},
obsidian(g,w,h){g.beginPath();g.moveTo(w*.2,h*.8);g.lineTo(w*.38,h*.12);g.lineTo(w*.62,h*.3);g.lineTo(w*.82,h*.75);g.closePath();

 g.fillStyle=gr;g.fill();
 g.strokeStyle='rgba(160,170,200,.5)';g.lineWidth=1.2;g.stroke();
 g.strokeStyle='rgba(200,210,255,.35)';g.beginPath();g.moveTo(w*.38,h*.12);g.lineTo(w*.5,h*.78);g.stroke();shade(g,w,h)},
meteor(g,w,h){const cx=w/2,cy=h/2;g.beginPath();
 for(let a=0;a<TAU;a+=.35){const r=w*.4*(.82+.32*hash2(Math.round(a*9),5,11));g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}
 g.closePath();const gr=g.createRadialGradient(cx-w*.12,cy-w*.12,w*.05,cx,cy,w*.45);
 gr.addColorStop(0,'#6a6470');gr.addColorStop(1,'#26222c');g.fillStyle=gr;g.fill();
 for(let i=0;i<7;i++){const x=cx+(hash2(i,1,3)-.5)*w*.5,y=cy+(hash2(i,2,3)-.5)*h*.5,r=w*(.04+hash2(i,3,3)*.05);
  g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.fillStyle='rgba(180,175,190,.25)';g.beginPath();g.arc(x-r*.3,y-r*.3,r*.5,0,TAU);g.fill()}
 shade(g,w,h)},
coin(g,w,h,o){const c=o&&o.c?o.c:['#f0cf6a','#9a7a28'];const cx=w/2,cy=h/2,r=w*.44;
 const gr=g.createRadialGradient(cx-r*.3,cy-r*.3,0,cx,cy,r);gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);
 g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill();

function paintSurface(b,R,ns){

  const wg=g.createLinearGradient(0,0,0,H*.16);wg.addColorStop(0,'#1e7a96');wg.addColorStop(1,'#5ec8d8');
  g.fillStyle=wg;g.beginPath();g.moveTo(0,0);for(let x=0;x<W;x+=8)g.lineTo(x,waterY[x]);g.lineTo(W,0);g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();for(let x=0;x<W;x+=6)g.lineTo(x,waterY[x]+1.5*Math.sin(x*.1));g.stroke();
  g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=6;g.beginPath();for(let x=0;x<W;x+=6)g.lineTo(x,waterY[x]+6+3*Math.sin(x*.07+2));g.stroke()}

function makeObj(defId,R,x,y){const d=CATALOG[defId];
 const sc=.85+R()*.35,w=Math.round(d.w*sc),h=Math.round(d.h*sc);
 const rot=d.large?(R()-.5)*.9:R()*TAU;
 const side=Math.ceil(Math.hypot(w,h))+4;
 const c=mkCanvas(side,side),g=c.getContext('2d');
 g.save();g.translate(side/2,side/2);g.rotate(rot);g.translate(-w/2,-h/2);
 DRAW[d.draw](g,w,h,d.opts);g.restore();
 const sdata=g.getImageData(0,0,side,side);
 const pts=[];const step=Math.max(4,Math.floor(side/26));
 for(let yy=0;yy<side;yy+=step)for(let xx=0;xx<side;xx+=step){if(sdata.data[(yy*side+xx)*4+3]>70)pts.push(xx,yy)}
 return{def:d,x:Math.round(x),y:Math.round(y),side,half:side/2,cv:c,pts,depth:0,exp:0,recovered:false,hinted:false,
  sox:(R()-.5)*70,soy:(R()-.5)*70};
}
function generate(biomeId,seedStr){
 sizeWorld();
 const b=BIOMES[biomeId];
 const R=mulberry(hashStr(biomeId+'|'+seedStr.toUpperCase()));
 const ns=R()*997;
 const ps=paintSurface(b,R,ns);
 // Layered rendering — no pixel readback (getImageData/putImageData), which can
 // silently no-op in sandboxed iframes. surface = static biome art; digCv = dug
 // craters painted directly; objCv = per-frame buried-object layer masked to digCv.
 const digCv=mkCanvas(W,H),dctx=digCv.getContext('2d');
 const objCv=mkCanvas(W,H),octx=objCv.getContext('2d');
 const depth=new Float32Array(W*H);
 const yMin=ps.waterY?H*.22:H*.09;
 const objects=[];
 const nLarge=1+(R()<.35?1:0);
 for(let i=0;i<nLarge;i++){const id=b.large[R()*b.large.length|0];
  const o=makeObj(id,R,W*.2+R()*W*.6,yMin+(H-yMin)*(.15+R()*.6));
  o.depth=.32+R()*.28;objects.push(o)}
 const tot=b.items.reduce((s,it)=>s+it[1],0);
 const n=11+(R()*5|0);
 for(let i=0;i<n;i++){
  let r=R()*tot,id=b.items[0][0];
  for(let k=0;k<b.items.length;k++){r-=b.items[k][1];if(r<=0){id=b.items[k][0];break}}
  let x=W/2,y=H/2,ok=false;
  for(let t=0;t<25&&!ok;t++){x=W*.06+R()*W*.88;y=yMin+R()*(H-yMin-H*.06);ok=true;
   for(let j=0;j<objects.length;j++){const o=objects[j];if(Math.hypot(o.x-x,o.y-y)<o.half+50){ok=false;break}}}
  const o=makeObj(id,R,x,y);o.depth=.2+R()*.5;objects.push(o)}
 world={seedStr:seedStr.toUpperCase(),biome:b,biomeId,surface:ps.c,digCv,dctx,objCv,octx,depth,objects,waterY:ps.waterY,ts:ns};
}
/* ============ terrain painting ============ */
function thAt(x,y){const ts=world.ts;return[
 .14+.1*vnoise(x*.008,y*.008,ts+3),
 .40+.12*vnoise(x*.006,y*.006,ts+7),
 .68+.1*vnoise(x*.007,y*.007,ts+11)]}
function layerIndexAt(x,y,D){const t=thAt(x,y);return D<t[0]?0:D<t[1]?1:D<t[2]?2:3}
function paintDig(wx,wy,r,digId,li,D){

 const g1=fbm(wx*.05,wy*.05,world.ts+li*31,2);
 const sh=clamp(1-D*.38,.45,1.1);
 const cr=clamp((base.c[0]+(g1-.5)*base.v)*sh,0,255)|0,
       cg=clamp((base.c[1]+(g1-.5)*base.v)*sh,0,255)|0,
       cb=clamp((base.c[2]+(g1-.5)*base.v)*sh,0,255)|0;
 dc.beginPath();
 for(let a=0,first=true;a<TAU+.001;a+=TAU/28){
  const rr=r*(.78+.5*vnoise(Math.cos(a)*1.5+digId*.37,Math.sin(a)*1.5,world.ts+99));
  const x=wx+Math.cos(a)*rr,y=wy+Math.sin(a)*rr;
  if(first){dc.moveTo(x,y);first=false}else dc.lineTo(x,y)}
 dc.closePath();
 dc.fillStyle='rgb('+cr+','+cg+','+cb+')';dc.fill();
 const rg=dc.createRadialGradient(wx,wy,r*.12,wx,wy,r*1.15);
 rg.addColorStop(0,'rgba(0,0,0,.24)');rg.addColorStop(.7,'rgba(0,0,0,.06)');rg.addColorStop(1,'rgba(0,0,0,0)');

function spawnParticles(wx,wy,li){

  parts.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6+Math.random()*.5,s:1.5+Math.random()*2.5,

function digAt(wx,wy){

 if(world.waterY&&wy<world.waterY[Math.round(wx)]+4)return;
 const t=TOOLS[state.tool];
 const D0=world.depth[(wy|0)*W+(wx|0)];
 if(D0>=.99)return;
 const li=layerIndexAt(wx,wy,D0);
 const hard=world.biome.layers[li].h;
 const eff=li>=2?t.rock:t.soft;
 const cost=t.cost*(li>=2?1.6:1);
 if(state.energy<cost){endExpedition();return}
 state.energy-=cost;
 const digId=state.digCount++;

   +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
   +'<input type="text" id="trdCode" value="'+tradeCodeSuggest()+'" maxlength="12">'
   +'<button class="btn" id="trdJoin">Enter room</button>'
   +'<div style="flex:1"></div><button class="btn2" id="trdBack">Back</button></div></div>';
  document.getElementById('trdJoin').onclick=()=>{
   const c=document.getElementById('trdCode').value.trim().toUpperCase();
   if(c.length<4){toast('Code must be at least 4 characters','#e8b34b');return}
   joinTradeRoom(c);showTrade()};
  document.getElementById('trdBack').onclick=()=>{showStart()};return}
 // in a room
 const t=trade,waiting=t.peers<2,crowded=t.peers>2;
 const iAcc=t.iAcceptedV>0&&t.iAcceptedV===t.their.v;
 const theyAcc=t.theyAcceptedV===t.my.v&&t.my.v>0;
 let body;
 if(waiting){
  body='<div class="sub" style="margin:18px 0">Room <b style="color:#f0d891;letter-spacing:2px">'+t.code+'</b> — waiting for your trade partner to enter the same code…</div>';
 }else{
  body=(crowded?'<div class="sub" style="color:#e86c5b">⚠ More than 2 people are in this room — trading is paused. Pick a fresh code.</div>':'')
   +'<div style="display:flex;gap:14px;flex-wrap:wrap">'
   +'<div style="flex:1;min-width:220px"><h2 style="font-size:14px">You offer</h2>'
   +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:13px">🪙</span>'
   +'<input type="text" id="trdCoins" value="'+(t.my.coins||0)+'" maxlength="7" style="width:80px"><span class="sub" style="margin:0">of '+meta.coins+'</span></div>'
   +'<div style="max-height:200px;overflow:auto">'+offerRows(t.my.items,true)+'</div></div>'
   +'<div style="flex:1;min-width:220px"><h2 style="font-size:14px">They offer</h2>'
   +'<div style="font-size:13px;margin-bottom:6px">🪙 '+(t.their.coins||0)+'</div>'
   +'<div style="max-height:200px;overflow:auto">'+offerRows(t.their.items,false)+'</div></div></div>'
   +'<div class="sub" style="margin-top:10px">'+(theyAcc?'✅ They accepted your current offer. ':'')+(iAcc?'✅ You accepted their offer — waiting on them.':'Changing any offer resets acceptances on both sides.')+'</div>';
 }
 m.innerHTML='<div class="panel"><h2>🤝 Trading — room '+t.code+'</h2>'+body
  +'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn2" id="trdLeave">Leave</button><div style="flex:1"></div>'
  +(!waiting&&!crowded?'<button class="btn" id="trdAccept"'+(iAcc?' disabled style="opacity:.5"':'')+'>Accept trade</button>':'')
  +'</div></div>';
 document.getElementById('trdLeave').onclick=()=>{leaveTrade();showStart()};
 const ab=document.getElementById('trdAccept');if(ab)ab.onclick=sendAccept;
 const ci=document.getElementById('trdCoins');
 if(ci)ci.onchange=()=>{
  const v=clamp(parseInt(ci.value,10)||0,0,meta.coins);
  if(v!==t.my.coins){t.my.coins=v;sendOffer()}
  showTrade()};
 m.querySelectorAll('.tplus').forEach(b=>b.onclick=()=>adjOffer(b.dataset.id,1));
 m.querySelectorAll('.tminus').forEach(b=>b.onclick=()=>adjOffer(b.dataset.id,-1));
}
/* ============ main loop ============ */
function frame(now){
 requestAnimationFrame(frame);
 updateDbg();
 const dpr=devicePixelRatio||1;
 if(cv.width!==Math.round(innerWidth*dpr)||cv.height!==Math.round(innerHeight*dpr)){
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
 const g=cv.getContext('2d');
 g.setTransform(dpr,0,0,dpr,0,0);
 g.fillStyle='#0e0c0a';g.fillRect(0,0,innerWidth,innerHeight);
 if(world){
  if(ui.digging&&ui.mode==='play'&&!ui.panMode&&now-ui.lastDigT>240&&ui.mouse){
   const p=s2w(ui.mouse.x,ui.mouse.y);digAt(p.x,p.y);ui.lastDigW=p;ui.lastDigT=now}
  shake*=.86;
  const shx=(Math.random()-.5)*shake,shy=(Math.random()-.5)*shake;
  g.save();
  g.translate(innerWidth/2+shx,innerHeight/2+shy);g.scale(cam.s,cam.s);g.translate(-cam.x,-cam.y);
  g.imageSmoothingEnabled=cam.s<2;
  g.drawImage(world.surface,0,0);
  g.drawImage(world.digCv,0,0);
  // buried objects: draw with exposure-based reveal, masked to dug regions
  const oc=world.octx;
  oc.clearRect(0,0,W,H);
  let anyObj=false;
  for(let k=0;k<world.objects.length;k++){const o=world.objects[k];
   if(o.recovered||o.exp<=.02)continue;
   anyObj=true;
   oc.globalAlpha=clamp((o.exp-.02)/Math.max(.04,o.def.rec-.02),.12,1);
   oc.drawImage(o.cv,o.x-o.half,o.y-o.half)}
  if(anyObj){
   oc.globalAlpha=1;
   oc.globalCompositeOperation='destination-in';
   oc.drawImage(world.digCv,0,0);
   oc.globalCompositeOperation='source-over';
   g.drawImage(world.objCv,0,0)}
  if(now<state.scanUntil){
   const pulse=.5+.5*Math.sin(now*.006);
   for(let k=0;k<world.objects.length;k++){const o=world.objects[k];
    if(o.recovered)continue;
    const col=CATC[o.def.cat]||'#ffffff';
    const r=Math.min(170,o.half*1.25+40),ox=o.x+o.sox,oy=o.y+o.soy;
    const rg=g.createRadialGradient(ox,oy,0,ox,oy,r);
    rg.addColorStop(0,col+'bb');rg.addColorStop(.55,col+'55');rg.addColorStop(1,col+'00');
    g.globalAlpha=.45+.3*pulse;g.fillStyle=rg;
    g.beginPath();g.arc(ox,oy,r,0,TAU);g.fill();
    g.globalAlpha=.35+.35*pulse;g.strokeStyle=col;g.lineWidth=2/cam.s;
    g.beginPath();g.arc(ox,oy,r*(.55+.25*pulse),0,TAU);g.stroke();g.globalAlpha=1}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
   p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;p.life-=.03;
   if(p.life<=0){parts.splice(i,1);continue}
   g.globalAlpha=Math.min(1,p.life)*.8;g.fillStyle=p.c;
   g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  g.globalAlpha=1;
  for(let i=glows.length-1;i>=0;i--){const gl=glows[i];gl.t+=.02;
   if(gl.t>1){glows.splice(i,1);continue}
   g.globalAlpha=(1-gl.t)*.8;g.strokeStyle='#f5e08a';g.lineWidth=3/cam.s+2;
   g.beginPath();g.arc(gl.x,gl.y,gl.r*(.6+gl.t*.9),0,TAU);g.stroke()}
  g.globalAlpha=1;
  g.restore();
  if(ui.mouse&&ui.mode==='play'&&!ui.panMode){
   g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;g.setLineDash([4,4]);
   g.beginPath();g.arc(ui.mouse.x,ui.mouse.y,TOOLS[state.tool].r*cam.s,0,TAU);g.stroke();g.setLineDash([])}
 }
}
/* ============ visual viewport: keep bottom UI above mobile browser chrome ============ */
function syncVV(){
 const vv=window.visualViewport;
 if(!vv){document.documentElement.style.setProperty('--vvb','0px');return}
 // gap between layout viewport bottom and the visible viewport bottom (URL bar etc.)
 const gap=Math.max(0,(innerHeight-(vv.height+vv.offsetTop)));
 document.documentElement.style.setProperty('--vvb',gap+'px');
}
if(window.visualViewport){
 visualViewport.addEventListener('resize',syncVV);
 visualViewport.addEventListener('scroll',syncVV);
}
addEventListener('resize',syncVV);
syncVV();
/* ============ debug readout (enable with #debug in URL, or triple-tap the location chip) ============ */
let dbgOn=/debug/.test(location.hash)||/debug/.test(location.search);
const dbg=document.createElement('div');
dbg.style.cssText='position:fixed;left:8px;bottom:calc(140px + var(--vvb,0px));z-index:30;font:11px monospace;color:#7dff9f;background:rgba(0,0,0,.72);padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre;max-width:70vw';
document.body.appendChild(dbg);
let dbgTaps=[];
document.getElementById('topL').addEventListener('pointerdown',()=>{
 const t=performance.now();dbgTaps=dbgTaps.filter(x=>t-x<800);dbgTaps.push(t);
 if(dbgTaps.length>=3){dbgOn=!dbgOn;dbgTaps=[]}
});
const dbgBtn=document.createElement('button');
dbgBtn.textContent='🐞';
dbgBtn.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:31;width:34px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(20,17,14,.8);font-size:14px;padding:0;cursor:pointer';
dbgBtn.onclick=()=>{dbgOn=!dbgOn};
document.body.appendChild(dbgBtn);
function updateDbg(){
 if(!dbgOn){dbg.style.display='none';return}
 dbg.style.display='block';
 const found=world?world.objects.filter(o=>!o.recovered).length:0;
 const r=cv.getBoundingClientRect();
 const vv=window.visualViewport;
 dbg.textContent=
  'win '+innerWidth+'x'+innerHeight+' dpr'+(devicePixelRatio||1).toFixed(2)+'\n'+
  'mouse '+(ui.mouse?Math.round(ui.mouse.x)+','+Math.round(ui.mouse.y):'—')+'  zoom '+(outerWidth?(outerWidth/innerWidth).toFixed(2):'?')+(vv?' vvs '+vv.scale.toFixed(2):'')+'\n'+
  'cvrect '+Math.round(r.left)+','+Math.round(r.top)+' '+Math.round(r.width)+'x'+Math.round(r.height)+'  backing '+cv.width+'x'+cv.height+'\n'+
  'world '+W+'x'+H+'  cam.s '+cam.s.toFixed(3)+'\n'+
  'cam '+Math.round(cam.x)+','+Math.round(cam.y)+'  vvb '+getComputedStyle(document.documentElement).getPropertyValue('--vvb').trim()+'\n'+
  'energy '+Math.ceil(state.energy)+'  buried '+found+'\n'+
  'lastDig '+lastDig;
}
const hadSave=loadMeta();
/* ===== TEST MODE: full unlock for trade testing — delete this block to restore real progression ===== */
for(const id in CATALOG){meta.found.add(id);if((meta.inv[id]|0)<3)meta.inv[id]=3}
if(meta.coins<500)meta.coins=500;
saveMeta();
/* ===== end TEST MODE ===== */
renderToolbar();renderSide();hud();showStart();
if(hadSave)toast('💾 Progress restored — Lv '+meta.lvl+' · 🪙'+meta.coins+' · 🏛 '+meta.found.size+' catalogued','#8fe86c');
requestAnimationFrame(frame);
</script>

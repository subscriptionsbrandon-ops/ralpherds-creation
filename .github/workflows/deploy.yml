name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Temporary diagnostic: print exactly what got built and what's about
      # to be uploaded, so it's visible in the run log rather than assumed
      # to match a local build. The live site keeps serving /src/main.tsx
      # (a source file that only exists pre-build) even after locking Pages'
      # Source to this Actions workflow, which means either this job isn't
      # producing the build we expect, or something downstream of upload
      # isn't serving what it uploads — this narrows down which.
      - name: Show what's being deployed
        run: |
          echo "--- dist/ contents ---"
          find dist -type f
          echo "--- dist/index.html ---"
          cat dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicitly locks GitHub Pages to serve from this Actions build
      # instead of a raw branch checkout. Without this, deploy-pages can
      # report success as an isolated API call without Pages' Source
      # setting actually being "GitHub Actions" — which can result in the
      # live site serving the repo's raw index.html (referencing
      # /src/main.tsx, a source file no browser can run) instead of the
      # built dist/ output this workflow actually produces.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
